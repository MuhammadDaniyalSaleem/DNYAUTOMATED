<form method="post" enctype="multipart/form-data" class="form smartform" data-save="{{kind}}">{% csrf_token %}<input type="hidden" name="source" value="{{request.GET.source|default:page}}">{{form.non_field_errors}}<div class="formgrid">{% for field in form %}<label class="{% if field.name == 'message' or field.name == 'attachment' %}full{% endif %}">{{field.label}}{{field}}{% if field.errors %}<small class="error">{{field.errors|striptags}}</small>{% endif %}</label>{% endfor %}</div><div class="formfoot"><small>Do not submit passwords, API keys or other sensitive credentials.</small><button class="btn" type="submit">Submit request →</button></div></form>
